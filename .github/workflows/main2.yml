name: CI/CD Pipeline with Container Registry

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  unit_test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest   

      - name: Run tests
        run: pytest -q

  build_and_push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: unit_test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/motivation-app:latest
            ghcr.io/${{ github.repository_owner }}/motivation-app:${{ github.sha }}

  Notification:
    name: Notify Telegram
    runs-on: ubuntu-latest
    needs: build_and_push
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Send Telegram message
        run: |
          curl -sS -X POST https://api.telegram.org/bot7077675840:AAGp6gPDJLko-DK4YNWhqh7beEUjSNC8QmA/sendMessage \
            -d chat_id=551247005 \
            -d text=Deployment completed successfully for commit ${{ github.sha }}!



