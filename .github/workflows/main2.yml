name: CI/CD pipeline

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read
  packages: write   # needed for GHCR push

jobs:
  unit_test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # If you have tests:
          pip install pytest

      - name: Run tests
        run: |
          pytest -q
        # If you don't have tests yet, replace with:
        # run: python -m compileall .

  build_and_push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: unit_test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/motivation-app:latest
            ghcr.io/${{ github.repository_owner }}/motivation-app:${{ github.sha }}
