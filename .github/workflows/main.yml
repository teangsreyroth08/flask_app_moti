name: CI-CD

on:
  push:
    branches: ["jenkinsdocker"]
  pull_request:
    branches: ["jenkinsdocker"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build -t demo-flask:${{ github.sha }} .
          docker images | head -n 20

      - name: Save image to tar
        run: |
          docker save demo-flask:${{ github.sha }} -o image.tar
          ls -lh image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar
          retention-days: 1

  unit-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: .

      - name: Verify artifact exists
        run: ls -lh image.tar

      - name: Load image
        run: docker load -i image.tar

      - name: Verify image loaded
        run: docker images | head -n 20

      - name: Run unit tests
        run: |
          docker run --rm \
            --entrypoint python \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            demo-flask:${{ github.sha }} \
            -m unittest discover -s tests -t .

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: unit-test
    if: github.ref == 'refs/heads/jenkinsdocker' && github.event_name == 'push'

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: docker load -i image.tar

      - name: Deploy to Server (copy image.tar and load)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          # Start ssh-agent so ssh-add works
          eval "$(ssh-agent -s)"

          # Add private key
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -

          # Add server to known_hosts (avoids interactive prompt)
          mkdir -p ~/.ssh
          ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts

          # Upload image.tar to server
          scp image.tar $SERVER_USER@$SERVER_IP:/tmp/image.tar

          # Load and run on server
          ssh $SERVER_USER@$SERVER_IP << EOF
            docker load -i /tmp/image.tar
            docker stop flask_app || true
            docker rm flask_app || true
            docker run -d --name flask_app -p 80:5000 demo-flask:${{ github.sha }}
            rm -f /tmp/image.tar
          EOF




