name: CI-CD

on:
  push:
    branches: ["jenkinsdocker"]
  pull_request:
    branches: ["jenkinsdocker"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build -t demo-flask:${{ github.sha }} .
          docker images | head -n 20

      - name: Save image to tar
        run: |
          docker save demo-flask:${{ github.sha }} -o image.tar
          ls -lh image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar
          retention-days: 1

  unit-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: .

      - name: Verify artifact exists
        run: ls -lh image.tar

      - name: Load image
        run: docker load -i image.tar

      - name: Verify image loaded
        run: docker images | head -n 20

      - name: Run unit tests
        run: |
          docker run --rm \
            --entrypoint python \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            demo-flask:${{ github.sha }} \
            -m unittest discover -s tests -t .

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: unit-test
    if: github.ref == 'refs/heads/jenkinsdocker' && github.event_name == 'push'

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: docker load -i image.tar

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
          docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Tag image
        run: |
          docker tag demo-flask:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/demo-flask:latest
          docker tag demo-flask:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/demo-flask:${{ github.sha }}

      - name: Push image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/demo-flask:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/demo-flask:${{ github.sha }}


