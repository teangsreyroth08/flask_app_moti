name: CI-CD

on:
  push:
    branches: [ "jenkinsdocker" ]
  pull_request:
    branches: [ "jenkinsdocker" ]

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: docker build -t demo-flask:latest .

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image for testing
        run: docker build -t demo-flask:test .

      - name: Run unit tests
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            demo-flask:${{ github.sha }} \
            python -m unittest discover -s tests -t .

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t demo-flask:integration .

      - name: Flask import test
        run: |
          docker run --rm demo-flask:integration \
          python -c "import flask; print('Integration OK')"

  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: integration-test
    if: github.ref == 'refs/heads/jenkinsdocker'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Example: deploy to a server via SSH
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker pull demo-flask:latest || true
            docker stop demo-flask || true
            docker rm demo-flask || true
            docker run -d --name demo-flask -p 5000:5000 demo-flask:latest
