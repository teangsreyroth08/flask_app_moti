name: CI-CD

on:
  push:
    branches: ["jenkinsdocker"]
  pull_request:
    branches: ["jenkinsdocker"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build -t demo-flask:${{ github.sha }} .
          docker images | head -n 20

      - name: Save image to tar
        run: |
          docker save demo-flask:${{ github.sha }} -o image.tar
          ls -lh image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar
          retention-days: 1

  unit-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: .

      - name: Verify artifact exists
        run: ls -lh image.tar

      - name: Load image
        run: docker load -i image.tar

      - name: Verify image loaded
        run: docker images | head -n 20

      - name: Run unit tests
        run: |
          docker run --rm \
            --entrypoint python \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            demo-flask:${{ github.sha }} \
            -m unittest discover -s tests -t .

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: unit-test
    if: github.ref == 'refs/heads/jenkinsdocker' && github.event_name == 'push'

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: docker load -i image.tar

      - name: Deploy to Server (copy image.tar and load)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          set -e

          mkdir -p ~/.ssh

          # Write key exactly as stored in secret
          printf "%s\n" "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # Avoid host prompt
          ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts

          # Copy artifact to server
          scp -i ~/.ssh/id_rsa image.tar $SERVER_USER@$SERVER_IP:/tmp/image.tar

          # Load + run
          ssh -i ~/.ssh/id_rsa $SERVER_USER@$SERVER_IP << EOF
            set -e
            docker load -i /tmp/image.tar
            docker stop flask_app || true
            docker rm flask_app || true
            docker run -d --name flask_app -p 80:5000 demo-flask:${{ github.sha }}
            rm -f /tmp/image.tar
          EOF
