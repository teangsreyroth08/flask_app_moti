services:
  web:
    build: .
    container_name: motivation_web
    ports:
      - "8001:5000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app:cached
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: motivation_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: quotesdb
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quotesdb"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
